<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpeakEasy · Microphone</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="wrap">
      <section class="card center">
        <h1 id="title">Let SpeakEasy hear you</h1>
        <p id="msg" class="muted">
          Chrome is asking for your microphone. SpeakEasy listens only to work out
          when you are talking. Audio never leaves this computer, only the totals do.
        </p>
        <button id="retry" class="btn primary" hidden>Ask again</button>
      </section>
    </main>
    <script src="permission.js"></script>
  </body>
</html>
